spring:
  application:
    name: store

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/store}
    username: ${DATABASE_USERNAME:store}
    password: ${DATABASE_PASSWORD:store}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jwt:
    # Dev-only fallback. Production MUST set JWT_SECRET (>= 32 chars, base64-ish random).
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:900}      # 15 minutes, in seconds
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800} # 7 days, in seconds

# Public URL of the storefront, used for Stripe success/cancel redirects.
websiteUrl: ${WEBSITE_URL:http://localhost:5173}

stripe:
  secretKey: ${STRIPE_SECRET_KEY:sk_test_missing}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY:whsec_missing}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  demo:
    # Creates the two demo logins documented in the README if they do not exist.
    # Harmless to leave on for a portfolio deployment; turn off for anything real.
    seed-users: ${SEED_DEMO_USERS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: ${PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.codewithkelvin.store: ${APP_LOG_LEVEL:INFO}
