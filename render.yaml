# Render blueprint. Create the database first (Render dashboard → New → Postgres,
# or point DATABASE_URL at a Neon instance), then: New → Blueprint → this repo.
#
# DATABASE_URL must be the JDBC form, which is not what Render/Neon hand you:
#   they give   postgresql://user:pass@host/db
#   Spring needs jdbc:postgresql://host/db  + username and password separately.
services:
  - type: web
    name: store-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false          # jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_KEY
        sync: false
      - key: WEBSITE_URL
        sync: false          # https://<your-storefront>.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # same origin as WEBSITE_URL
      - key: SEED_DEMO_USERS
        value: "true"
